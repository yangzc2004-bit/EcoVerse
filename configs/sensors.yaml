packages:
  A:
    description: "High-frequency water quality station (4h cadence, 2% Gaussian noise, 1-3d dropout)"
    preferred_states: ["O", "C"]
    fallback_states: ["N", "D"]
    drivers: ["I", "T", "q"]
    cadence_steps: 1           # every 4 hours (dt = 1/6 d)
    irregular_jitter_steps: 0
    noise_type: "gaussian"
    noise_sigma: 0.02
    dropout_blocks: [1, 3]     # number of outage blocks over 365 d
    dropout_days: [1.0, 3.0]

  B:
    description: "Traditional ecological sampling (7-14d irregular cadence, 8% log-normal noise)"
    preferred_states: ["N", "P1", "P2", "Z1", "D"]
    fallback_states: ["P1", "P2", "Z1", "Z2"]
    drivers: []
    interval_days: [7.0, 14.0]
    noise_type: "lognormal"
    noise_sigma: 0.08
    dropout_blocks: [0, 0]
    dropout_days: [0.0, 0.0]

  C:
    description: "Single-variable remote sensing / buoy (Poisson intervals + cloud dropout)"
    preferred_states: ["P1", "O"]
    fallback_states: ["P1", "Z1"]
    pick_single_state: true
    drivers: ["I", "T"]
    mean_interval_days: [1.5, 4.0]
    noise_type: "lognormal"
    noise_sigma: 0.06
    dropout_blocks: [2, 6]
    dropout_days: [2.0, 7.0]

train_augmentation:
  min_observed_states: 1
  max_observed_states: 6
  driver_include_prob: 0.75
  min_steps_interval: 1
  max_steps_interval: 48       # up to 8 days
  noise_sigma_range: [0.01, 0.12]
  dropout_prob: 0.5
  dropout_blocks: [1, 3]
  dropout_days: [1.0, 5.0]
