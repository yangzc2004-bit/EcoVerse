# 4 unseen structural cross-preset combinations for test_2b_comp
variants_2b:
  river_competition:
    base: river
    active_states_override:
      P2: true
    optional_p2_prob: 1.0
    add_channels: [1, 3, 5, 9, 10]
    sigma_override:
      P2: [0.02, 0.12]
    priors_override:
      v_max2_ratio: {dist: U, range: [0.4, 0.85]}
      c_comp: {dist: LU, range: [0.02, 0.20]}

  lake_cascade:
    base: lake
    active_states_override:
      Z2: true
    add_channels: [8, 12, 14]
    sigma_override:
      Z2: 1.0

  terrestrial_cascade:
    base: terrestrial
    active_states_override:
      Z2: true
    add_channels: [8, 12, 14]
    sigma_override:
      Z2: 0.0

  chemostat_detritus_recycle:
    base: chemostat
    active_states_override:
      D: true
    add_channels: [15]
    sigma_override:
      D: 1.0
    delta_override:
      D: 0.0
    priors_override:
      k_dec: {dist: LU, range: [0.05, 0.3]}

