[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecoverse"
version = "0.1.0"
description = "Composable synthetic ecosystem dynamics engine and standardized benchmark for PyTorch"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "torch>=2.1",
    "zarr>=2.16",
    "pyarrow>=14.0",
    "pandas>=2.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "filelock>=3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ecoverse"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "ecoverse/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
